
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Projects | Nunaui</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
        }

        header {
            padding: 24px 8%;
            border-bottom: 1px solid #292929;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 19px;
            font-weight: 700;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        nav a {
            color: #999;
            font-size: 14px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: white;
        }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 90px 30px;
        }

        .tag {
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 68px);
            letter-spacing: -3px;
            margin: 18px 0;
        }

        .subtitle {
            color: #999;
            font-size: 16px;
            margin-bottom: 55px;
        }

        .project {
            display: block;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 32px;
            background: #181818;
            transition: border-color 0.2s, background 0.2s;
        }

        .project:hover {
            border-color: #777;
            background: #1c1c1c;
        }

        .project-label {
            color: #888;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .project h2 {
            font-size: 36px;
            letter-spacing: -1px;
            margin: 15px 0;
        }

        .project p {
            color: #aaa;
            line-height: 1.8;
            max-width: 600px;
        }

        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
            color: #ddd;
            font-size: 14px;
        }

        .arrow {
            font-size: 20px;
        }

        footer {
            border-top: 1px solid #292929;
            padding: 25px 8%;
            color: #666;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px 6%;
            }

            main {
                padding: 65px 7%;
            }

            .project {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a class="logo" href="index.html">Nunaui</a>
        <nav>
            <a href="index.html">Back to home</a>
        </nav>
    </header>

    <main>
        <div class="tag">Our work</div>
        <h1>Projects</h1>
        <p class="subtitle">
            A collection of things we're building.
        </p>

        <a class="project"
           href="https://github.com/ORGANIZATION/Nunaui">

            <div class="project-label">Featured project</div>

            <h2>Nunaui</h2>

            <p>
              An ambitious desktop and virtual reality experience
              set across a semi-realistic, vast environment. Explore, survive,
              and probably die repeatedly in the world.
            </p>

            <div class="project-footer">
                <span>Explore project</span>
                <span class="arrow">↗</span>
            </div>

        </a>
    </main>

    <footer>
        Footer text.
    </footer>

</body>
</html>
